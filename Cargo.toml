[package]
name = "statsdcat"
version = "0.1.0"
edition = "2021"
description = "A fast, standalone StatsD & DogStatsD metrics inspector, listener, aggregator, and emitter"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/statsdcat"
readme = "README.md"
keywords = ["statsd", "dogstatsd", "metrics", "observability", "udp"]
categories = ["command-line-utilities", "network-programming", "development-tools"]

[lib]
name = "statsdcat"
path = "src/lib.rs"

[[bin]]
name = "statsdcat"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
